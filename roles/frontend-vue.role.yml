id: frontend-vue
name: 全栈研发团队 · 前端开发（Web）
description: 按冻结契约实现 Web 前端；带 UI 能力闸与配色治理。
kind: stack
# 组内 AND、组间 OR：两个标记必须在同一组，单凭 package.json 不算 Vue。
# `vite.config.*` 是后缀通配：同名任意扩展名（.ts / .js / .mts …）都算命中。
detect:
  - [package.json, vite.config.*]
include:
  - role-init
  - dev-orchestrator
  - impeccable
  - ui-theme-governance
  - acceptance-guard
contract:
  input: design.md + 契约 + UI 规范
  output: 实现代码与走查截图
packs:
  - name: team-core
    dir: ~/.dsh/skill-packs/team-core
