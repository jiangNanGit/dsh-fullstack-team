id: mobile-flutter
name: 全栈研发团队 · 移动端（Flutter）
description: 按冻结契约实现 Flutter 端；Flutter 能力由 skill 包按需提供。
kind: stack
detect:
  - pubspec.yaml
include:
  - role-init
  - dev-orchestrator
  - impeccable
  - ui-theme-governance
contract:
  input: design.md + 契约 + 设计稿
  output: Flutter 实现与走查截图
packs:
  - name: team-core
    dir: ~/.dsh/skill-packs/team-core
  - name: flutter
    dir: ~/.dsh/skill-packs/flutter
    include:
      - '*'
    hint: 把官方 Flutter skill 包解到该目录，或 dsh plugin add 装一个提供 flutter skill 的包
